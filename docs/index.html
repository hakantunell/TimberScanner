<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17351f">
  <title>TimberScanner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Mobil prototyp</p>
      <h1>TimberScanner</h1>
    </header>

    <section id="role-picker" class="panel">
      <h2>Välj läge</h2>
      <div class="role-grid">
        <button id="viewer-mode">Dator / livevy</button>
        <button id="capture-mode">Telefon / skanna</button>
      </div>
    </section>

    <section id="connection-screen" class="panel" hidden>
      <h2>Anslut telefon</h2>
      <p id="pairing-help"></p>
      <div id="qr-code" class="qr-code"></div>
      <div id="manual-connect">
        <label id="peer-label" for="peer-code">Sessionskod</label>
        <div class="peer-row">
          <input id="peer-code" autocomplete="off" autocapitalize="none" spellcheck="false">
          <button id="connect-peer">Anslut</button>
        </div>
      </div>
      <p><strong>Status:</strong> <span id="connection-status">Inte ansluten</span></p>
    </section>

    <section id="work-screen" hidden>
      <section class="work-toolbar panel">
        <div>
          <strong id="work-status">Ansluten</strong>
          <span id="work-detail">Väntar på bildrutor</span>
        </div>
        <button id="show-pairing" class="secondary">Visa QR-kod</button>
      </section>

      <section id="capture-panel" hidden>
        <section class="camera-card">
          <video id="camera" playsinline muted></video>
          <canvas id="snapshot" hidden></canvas>
          <div id="camera-placeholder">Kameran är inte startad</div>
        </section>
        <section class="controls">
          <button id="start-camera">Starta kamera</button>
          <button id="capture" disabled>Ta bild</button>
          <button id="new-pass" disabled>Ny rotation</button>
          <button id="export" class="secondary" disabled>Exportera reservkopia</button>
          <button id="reset" class="secondary">Rensa skanning</button>
        </section>
        <section class="settings-card">
          <label for="scale-mm">Referenslängd i bilden, mm</label>
          <input id="scale-mm" type="number" inputmode="decimal" min="1" step="1" placeholder="Exempel: 500">
        </section>
      </section>

      <section class="status-grid">
        <article><span>Bildrutor</span><strong id="image-count">0</strong></article>
        <article><span>Aktuell rotation</span><strong id="pass-count">1</strong></article>
        <article><span>Analyserade</span><strong id="analysis-count">0</strong></article>
        <article><span>Lagring</span><strong id="storage-status">Klar</strong></article>
      </section>

      <section class="analysis-section">
        <h2>Analysunderlag</h2>
        <p>Bildrutorna visas bara under prototypfasen. Färgen visar aktuell skärpeklassning.</p>
        <div id="captures" class="captures"></div>
      </section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
