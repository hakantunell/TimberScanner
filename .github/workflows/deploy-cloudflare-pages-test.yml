name: Deploy Cloudflare Pages test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'cloudflare/pages-test/**'
      - '.github/workflows/deploy-cloudflare-pages-test.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
      - name: Install Wrangler
        run: npm install --no-save wrangler@4.114.0
      - name: Create Pages project if needed
        shell: bash
        run: |
          set -o pipefail
          if npx wrangler pages project list | grep -q 'timber-scanner-pages-test'; then
            echo 'Pages project already exists.'
          else
            npx wrangler pages project create timber-scanner-pages-test --production-branch main
          fi
      - name: Prepare TimberScanner Pages copy
        shell: bash
        run: |
          rm -rf cloudflare/pages-test/public
          mkdir -p cloudflare/pages-test/public
          cp -R docs/. cloudflare/pages-test/public/
      - name: Deploy TimberScanner with Pages Functions
        shell: bash
        run: |
          cd cloudflare/pages-test
          npx wrangler pages deploy public \
            --project-name timber-scanner-pages-test \
            --branch main \
            --commit-dirty=true
