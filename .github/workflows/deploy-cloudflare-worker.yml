name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/worker/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_API_TOKEN is missing or empty."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::GitHub secret CLOUDFLARE_ACCOUNT_ID is missing or empty."
            exit 1
          fi
          echo "Cloudflare secrets are present."

      - name: Install dependencies
        run: npm install

      - name: Show Wrangler version
        run: npx wrangler --version

      - name: Verify Cloudflare authentication
        shell: bash
        run: |
          set -o pipefail
          npx wrangler whoami 2>&1 | tee /tmp/wrangler-whoami.log

      - name: Provision R2 bucket before Worker deploy
        shell: bash
        run: |
          set -o pipefail
          echo "Listing R2 buckets..."
          npx wrangler r2 bucket list 2>&1 | tee /tmp/r2-list.log

          if grep -q 'timber-scanner-scans' /tmp/r2-list.log; then
            echo "R2 bucket timber-scanner-scans already exists."
          else
            echo "Creating R2 bucket timber-scanner-scans..."
            npx wrangler r2 bucket create timber-scanner-scans 2>&1 | tee /tmp/r2-create.log
          fi

      - name: Deploy Worker
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/wrangler-deploy.log
